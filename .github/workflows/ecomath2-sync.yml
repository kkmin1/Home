name: ecomath2 one-shot sync

on:
  push:
    branches:
      - ecomath2-sync-20260910

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ecomath2-sync-20260910
          fetch-depth: 0

      - name: Exit until payload is ready
        shell: bash
        run: |
          if [ ! -f .ecomath2-sync/READY ]; then
            echo "payload not ready"
            exit 0
          fi

      - name: Reconstruct payload
        shell: bash
        run: |
          mkdir -p /tmp/ecomath2
          cat .ecomath2-sync/part*.b64 | base64 -d > /tmp/ecomath2.tar.gz
          tar -xzf /tmp/ecomath2.tar.gz -C /tmp/ecomath2
          test -f /tmp/ecomath2/eco-math2.html
          test -f /tmp/ecomath2/CHANGELOG-ecomath2.md

      - name: Commit all Econ Math II changes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          CURRENT_MAIN=$(git rev-parse origin/main)
          EXPECTED_MAIN=26f469f6a34f0fb1e66f308078f5716535d66cff
          if [ "$CURRENT_MAIN" != "$EXPECTED_MAIN" ]; then
            echo "main moved: $CURRENT_MAIN"
            exit 1
          fi
          git checkout -B main origin/main
          find /tmp/ecomath2 -maxdepth 1 -type f -print0 > /tmp/ecomath2-files
          while IFS= read -r -d '' f; do
            cp "$f" ./
          done < /tmp/ecomath2-files
          while IFS= read -r -d '' f; do
            git add -- "$(basename "$f")"
          done < /tmp/ecomath2-files
          git diff --cached --stat
          git commit -m "ecomath2: split large chapters and reorganize navigation"
          git push origin main
