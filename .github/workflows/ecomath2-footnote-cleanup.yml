name: One-time ecomath2 footnote cleanup

on:
  push:
    paths:
      - '.github/workflows/ecomath2-footnote-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clean legacy footnotes, validate, and record history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          files = [
              'differential-equation-second-stability.html',
              'dynamic-optimization-discrete-maximum-principle.html',
              'dynamic-programming-lq.html',
              'differential-equation-systems-nonlinear.html',
              'dynamic-optimization-applications-discrete-growth-dynamics.html',
              'dynamic-optimization-applications-continuous-turnpike.html',
              'optimal-control-constraints.html',
              'differential-equation-applications-phillips.html',
              'calculus-of-variations-constraints.html',
              'differential-equation-basics-nonlinear.html',
              'difference-equation-applications2-dornbusch-policy.html',
          ]

          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'<div class="footnotes">.*?</div>', '', text, flags=re.S)
              text = re.sub(r'<section class="footnotes">.*?</section>', '', text, flags=re.S)
              p.write_text(text, encoding='utf-8')

          failed = False
          for name in files:
              text = Path(name).read_text(encoding='utf-8')
              ids = re.findall(r'\bid="([^"]+)"', text)
              counts = {x: ids.count(x) for x in set(ids)}
              dup = sorted(x for x, n in counts.items() if n > 1)
              broken = sorted({target for target in re.findall(r'href="#([^"]+)"', text) if target not in ids})
              if dup or broken:
                  failed = True
                  print(f'{name}: duplicate_ids={dup} broken_fragments={broken}')
              else:
                  print(f'{name}: OK')
          if failed:
              sys.exit(1)

          log = Path('CHANGELOG-ecomath2.md')
          entry = """

          ## 2026-09-10 — 각주 구조 정리
          - 절별 분할 과정에서 남은 장 전체 legacy footnote 블록을 제거했다.
          - 11개 영향 파일의 중복 HTML `id`를 제거했다.
          - 각주 `fn`/`fnref` fragment backlink를 파일 내부에서 다시 검증했다.
          - 본문, 수식, 목차 및 일반 내비게이션 링크는 변경하지 않았다.
          - 검증 기준: 대상 파일에서 duplicate id = 0, broken internal fragment = 0.
          """
          log.write_text(log.read_text(encoding='utf-8').rstrip() + entry + '\n', encoding='utf-8')
          PY
      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/ecomath2-footnote-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' CHANGELOG-ecomath2.md .github/workflows/ecomath2-footnote-cleanup.yml
          git commit -m 'ecomath2: repair footnote anchors after section split'
          git push origin HEAD:main
