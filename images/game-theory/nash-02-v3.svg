<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 -50 900 430">
  <style>
    text { fill:#111; font-size:30px; font-family:Times,serif; }
    .grid { stroke:#111; stroke-width:3; fill:none; shape-rendering:crispEdges; }
  </style>

  <!-- table border -->
  <rect class="grid" x="200" y="20" width="600" height="300" />

  <!-- internal vertical cell borders -->
  <line class="grid" x1="400" y1="20" x2="400" y2="320" />
  <line class="grid" x1="600" y1="20" x2="600" y2="320" />

  <!-- internal horizontal cell borders -->
  <line class="grid" x1="200" y1="120" x2="800" y2="120" />
  <line class="grid" x1="200" y1="220" x2="800" y2="220" />

  <!-- diagonal header divider -->
  <line class="grid" x1="200" y1="20" x2="400" y2="120" />

  <text x="220" y="100">갑</text>
  <text x="320" y="70">을</text>

  <text x="445" y="85">사슴</text>
  <text x="645" y="85">토끼</text>

  <text x="250" y="190">사슴</text>
  <text x="250" y="290">토끼</text>

  <text x="465" y="190">3, 3</text>
  <text x="665" y="190">0, 1</text>
  <text x="465" y="290">1, 0</text>
  <text x="665" y="290">1, 1</text>

  <text x="280" y="0">&lt;표 2&gt; 사슴사냥 게임</text>
</svg>